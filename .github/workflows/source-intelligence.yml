# Advisory public-source intelligence, never changes data/seen.json or verified_at.
name: Official sources and discovery review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-intelligence.yml"
      - "data/seen.json"
      - "scripts/source-universe.mjs"
      - "scripts/source-*"
      - "scripts/publish-health.mjs"
      - "scripts/publish-health.test.mjs"
      - "scripts/feed-*"
      - "scripts/discover-feeds.mjs"
      - "data/discovery-feeds.json"
      - "data/discovery-reviewed.json"
  schedule:
    # 06:31 Vietnam time on Monday and Thursday.
    - cron: "31 23 * * 0,3"

permissions:
  contents: read

concurrency:
  group: opportunity-source-intelligence
  cancel-in-progress: false

jobs:
  scan:
    name: Produce human-review artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check official URLs for reachability (not eligibility)
        run: node scripts/source-monitor.mjs
        env:
          SOURCE_MONITOR_CONCURRENCY: "5"
          SOURCE_MONITOR_TIMEOUT_MS: "10000"
      - name: Discover candidate opportunities from curated official feeds
        run: node scripts/discover-feeds.mjs
      - name: Upload reachability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health
          path: artifacts/source-health.json
          if-no-files-found: warn
          retention-days: 21
      - name: Upload human review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-review
          path: artifacts/discovery-review.json
          if-no-files-found: warn
          retention-days: 21

  publish:
    # The monitor is advisory; this job only publishes a sanitized public HTTP
    # snapshot after scanning. Never change data/seen.json or verified_at.
    name: Publish public health snapshot
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: source-health
          path: artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sanitize and validate snapshot
        run: |
          node --test scripts/publish-health.test.mjs
          node scripts/publish-health.mjs
      - name: Commit advisory JSON only
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/source-health.json
          if ! git diff --cached --quiet; then
            git commit -m "ops: refresh public source reachability (not verification)"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN do not automatically fire on:push Actions.
      - name: Deploy updated Pages snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
