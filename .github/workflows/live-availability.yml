name: Live GitHub Pages availability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-availability.yml"
      - "scripts/live-smoke.mjs"
  schedule:
    # 05:20 Asia/Ho_Chi_Minh each day.
    - cron: "20 22 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Verify public site and static assets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify deployed HTML and asset availability
        run: node scripts/live-smoke.mjs
