name: Live GitHub Pages availability

on:
  workflow_dispatch:
  # Run only after the production build *and* Pages deployment are complete.
  # A parallel push-triggered check would see stale HTML before new favicon assets exist.
  workflow_run:
    workflows: ["Validate and deploy dashboard"]
    types: [completed]
    branches: [main]
  schedule:
    # 05:20 Asia/Ho_Chi_Minh each day.
    - cron: "20 22 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Verify public site and static assets
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify deployed HTML and asset availability
        run: node scripts/live-smoke.mjs
