# Validates data/seen.json and builds the app on every PR; on main also deploys to GitHub Pages.
# Repo Settings > Pages > Source must be "GitHub Actions". Data rules: SCHEMA.md, AGENTS.md.
name: Validate and deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "playwright.config.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "components.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "data/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "playwright.config.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "components.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # GITHUB_TOKEN commits from the NZ scanner do not trigger ordinary push workflows.
  # workflow_run is the native, token-free handoff after the scanner job finishes.
  workflow_run:
    workflows: ["NZ academic careers discovery"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One Pages deployment at a time; never cancel a deployment in progress.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test, audit and build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gen-data.mjs stamps "updated" from the last commit touching data/seen.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Validate data/seen.json
        run: npm run validate

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (vite base /opportunity-dashboard/)
        run: npm run build

      - name: Install pinned browser QA runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps --only-shell chromium

      - name: E2E production regression suite
        run: npx playwright test

      - name: Publish failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
